name: PR title

# main 只收 squash 合并，且 squash 的 subject 取 PR 标题，所以 PR 标题就是 main 上那一行。
# release-please 只认 Conventional Commits：标题不合格式时它不报错，只是把这次改动从
# CHANGELOG 和版本号里静默漏掉。
#
# 单独成一个 workflow 而不进 ci.yml：改标题只触发 `edited`，给 ci.yml 加上它的话，改一下
# PR 描述就会把三平台矩阵整套重跑一遍。

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

# 不设 concurrency：它是 required check，而 GitHub 认同一 commit 上最新的那次运行。push 后
# 紧接着改 PR 描述时，两次运行相隔一秒，cancel-in-progress 会把其中一次取消，取消的那次
# 若是最新的，PR 就被挡住，直到手动重跑。这一跑只要几秒，取消旧运行省不下任何东西。

jobs:
  conventional:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      # 标题经 env 传入，不直接插进 run:——标题由 PR 作者控制，`${{ }}` 是在 shell 解析之前
      # 做的文本替换，直接插进去就是脚本注入
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|refactor|perf|test|build|ci|chore'
          re="^($types)(\\([a-z0-9-]+\\))?!?: [^ ](.*[^. ])?\$"
          # 标题原样进 CHANGELOG.md，而它按约定是英文：可打印 ASCII 以外的字节一律不收
          if [[ $TITLE =~ $re ]] && ! printf '%s' "$TITLE" | LC_ALL=C grep -q '[^ -~]'; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error::PR title is not a Conventional Commits subject: $TITLE"
          echo "Expected: <type>(<scope>)!: <description>"
          echo "  type: ${types//|/ | }"
          echo "  scope and ! are optional; scope is lowercase; no trailing period or space"
          echo "  English, printable ASCII only: the title goes into CHANGELOG.md verbatim"
          echo "  write a revert as an ordinary change, e.g. fix(web): revert the folded diff lines"
          echo "The title becomes the commit subject on main; release-please reads it for CHANGELOG.md."
          exit 1
