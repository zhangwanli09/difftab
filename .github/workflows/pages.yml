name: Pages

# 官网（site/）构建后发到 GitHub Pages。与产品的 CI / 发布完全无关：官网红了不挡发版，
# 产品门禁也不看官网。仓库 Settings → Pages 的 Source 须选「GitHub Actions」，否则
# deploy 一步报 404。

on:
  push:
    branches: [main]
    # 锁文件也算：Tailwind / Vite 升级会改变产物，而 site/ 一个字没动；package.json 里有
    # site:build 那条 script 本身；页面引用的资源由 Vite 从 assets/ 打包进产物，只换资源也要重新部署
    paths: [site/**, assets/**, package.json, pnpm-lock.yaml, .github/workflows/pages.yml]
  # PR 上只构建、不部署：把 site/ 改坏的 PR 在合并前就红，而不是合进 main 后部署失败、
  # 线上静默停在上一版。不放进 ci.yml：那份会被 release.yml 复跑，官网红了不该挡发版
  pull_request:
    paths: [site/**, assets/**, package.json, pnpm-lock.yaml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

# main 上串行且不取消正在跑的部署——半途被取消的部署会让站点停在上一版；
# PR 上同一分支的旧构建直接取消
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 与 ci.yml 同一条顺序：pnpm/action-setup 排在 setup-node 之前，否则 cache: 'pnpm'
      # 找不到 pnpm；版本读 packageManager 字段，不用 corepack
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run site:build

      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.event_name != 'pull_request' }}
        with:
          path: site/dist

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # 写 Pages 的权限只给这一个作业：PR 上跑的构建拿不到
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
