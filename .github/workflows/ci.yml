name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI 分两层：
#   build——tsdown 要求 Node ^22.18 || >=24.11、Vite 8 要求 >=22.12，均高于
#              产品运行时下限 22.0.0，所以工具链只跑在一档较新的 Node 上；
#   matrix——测的是**用户真正拿到的产物**，三平台 × Node 22.0.x / 24 / 26，
#              完全不执行安装、也不需要 pnpm。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & static checks (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup 必须排在 actions/setup-node 之前，
      # 否则后者的 cache: 'pnpm' 找不到 pnpm 可执行文件，缓存步骤直接失败。
      # 不传 version——让它读 package.json 的 packageManager 字段（唯一事实来源）；
      # 也不用 corepack enable:Corepack 已不再随 Node 25+ 发行版分发。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # LEFTHOOK=1 是必需的：lefthook 的 postinstall 在检测到 CI 时会**跳过**
      # `lefthook install`(postinstall.js 里 `isEnabled(process.env.CI) &&
      # !isEnabled(process.env.LEFTHOOK)` 直接 return)。不设这个变量的话，
      # 生命周期脚本照跑、却不写钩子，下面那条验收就永远为假——而它为假的原因
      # 与 allowBuilds 无关，属于假红。
      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '1'

      # allowBuilds 白名单生效的验收，两条一起看：
      #   1. 直接问 pnpm 自己忽略了谁——漏列白名单时**安装本身是成功的**，
      #      只是构建脚本被静默跳过，所以不能以「安装没报错」为准；
      #   2. 钩子文件实际存在——证的是脚本不仅跑了，还真干了活。
      - name: pnpm 没有忽略任何构建脚本
        run: |
          out=$(pnpm ignored-builds)
          echo "$out"
          echo "$out" | grep -q 'None' || { echo 'FAIL 有依赖的构建脚本被忽略——检查 pnpm-workspace.yaml 的 allowBuilds'; exit 1; }

      - name: lefthook hooks 已写入 .git/hooks
        run: test -f .git/hooks/pre-commit && test -f .git/hooks/pre-push

      # pnpm 设置写在正确的文件里：pnpm 11 对写错位置的设置是静默忽略
      - name: pnpm 设置不在 package.json / .npmrc 里
        run: |
          node -e "if ('pnpm' in require('./package.json')) { console.error('package.json 里出现了 pnpm 字段——pnpm 11 不再读取它'); process.exit(1) }"
          if [ -f .npmrc ]; then
            grep -vE '^\s*(#|$)' .npmrc | grep -vE '^(registry|@[^:]+:registry|//)' && { echo '.npmrc 里出现了非 registry/auth 设置'; exit 1; } || true
          fi

      - run: pnpm exec biome ci
      - run: pnpm run typecheck
      - run: pnpm run test

      # bin/difftab.js 以 100755 入库（先跑，不用等构建）+ 未被构建管线触碰
      # （该脚本内部会跑一次完整构建）
      - run: pnpm run check:bin

      # 体积门禁只在这里跑一次。matrix 档下载的是**同一份** dist/ 产物，字节完全相同，
      # 再跑 9 遍不增加任何覆盖，却引入一个本不存在的方差面：gzip 的输出长度取决于
      # 各 Node 大版本自带的 zlib，贴着预算的行会只在某一个 Node 上红，看起来像平台
      # 问题而其实不是。matrix 档该跑的是真有平台维度的东西（冒烟、冷启动）。
      - name: 产物体积门禁
        run: pnpm run size

      - name: 样式层叠方案生效
        run: pnpm run check:css

      - name: 发布产物内容干净
        run: pnpm run check:pack

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  matrix:
    name: smoke ${{ matrix.os }} · Node ${{ matrix.node }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22.0.x 是产品运行时下限本身，不是 22 线的最新版——下限档要真的跑在下限上。
        #
        # **24 与 26 在档位上是同一格**：监听档的分界是 Node 24.14.0，而
        # watch-tiers.test.js 是自动判档、不用 DIFFTAB_WATCH_TIER 强制，于是实际覆盖是
        # 22.0.x → ubuntu C / macOS·Windows B，24 与 26 → 三端均 A。26 留着不是为了补
        # 档位，是最新 Node 的前向兼容金丝雀（fs.watch 语义、node --test 行为）。
        #
        # 另外注意这里的 '24' / '26' 是**浮动解析**，档位覆盖会随上游发版自己变：
        # Node 24.14.0 发布之前 ubuntu × 24 判的是 C 档，发布之后自动变成 A，
        # 而 CI 一个字都没改。看这张矩阵时别把它当成钉死的映射。
        node: ['22.0.x', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # `node --test` 在一个用例都没匹配上时是 **0 用例、exit 0**——一次改名、
      # 一次目录搬迁，或某个平台上的引号行为不同，就会把「只读承诺的唯一自动化保护」
      # （S1 起主门禁就落在 test/smoke/）变成一个什么都没跑的绿勾。
      # 先数一遍，数不到就响亮地失败。
      - name: 冒烟用例确实被发现了
        shell: bash
        run: |
          node -e "
          const { readdirSync } = require('node:fs');
          const files = readdirSync('test/smoke').filter((f) => f.endsWith('.test.js'));
          if (files.length === 0) { console.error('test/smoke/ 下没有任何 *.test.js——node --test 会静默跑 0 个用例'); process.exit(1); }
          // 两层只读验证是 4.1「零写操作」承诺在开发期唯一的自动化护栏。
          // 按文件名点名一次：改名、搬走、误删都会在这里响亮地失败，而不是变成
          // 一次「少跑了一个文件」的绿勾。
          for (const required of ['readonly.test.js', 'readonly-git-dir.test.js']) {
            if (!files.includes(required)) { console.error('只读性门禁 test/smoke/' + required + ' 不见了'); process.exit(1); }
          }
          console.log('发现 ' + files.length + ' 个冒烟文件：' + files.join(', '));
          "

      # 本档**完全不执行安装、也不需要 pnpm**：它的全部意义就是只跑用户真正拿到的
      # dist/ 产物。一旦装了东西，测的就不再是那个东西。
      # 因此直接 node --test 打到冒烟套件文件，不经 package.json 的 script。
      #
      # 套件自带 fixture 生成（test/fixtures/make.mjs，零依赖纯 JS），所以这里除了
      # runner 自带的 git 之外不需要任何前置步骤；主门禁也在其中。
      - name: 冒烟测试（跑 dist/ 产物）
        run: node --test "test/smoke/*.test.js"

      - name: 冷启动测量(≤300ms)
        run: node scripts/bench-startup.mjs

  # 压低 inotify 配额验降级（那条 Linux 验收项）。
  #
  # **另起一档的理由是它动的是全机器共享的 sysctl**:`node --test` 按文件并行跑，
  # 混进冒烟套件等于在别的监听用例跑到一半时把配额抽掉。GitHub 的 ubuntu runner
  # 自带免密 sudo，这正是"CI runner 就是真机"那条口径里最实在的一条。
  #
  # Node 24 一档：配额耗尽这件事只对**建递归 watch 的档位**(A)有意义，Node 22 在
  # Linux 上判到 C 档、一个递归 watch 都不建。
  inotify-quota:
    name: inotify 配额耗尽时降级为轮询
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: node scripts/check-inotify-degrade.mjs

  # `npm i -g` 三端验收。
  #
  # **另起一档而不是塞进 matrix**：那一档"完全不装依赖"是红线，而这里要做的
  # 恰好是装东西——装的是产品自己（零依赖，所以"装了什么"本身就是一条断言）。混在
  # 一起跑的话，冒烟绿的时候没人说得清测的是哪个 difftab。
  #
  # 只跑 Node 22.0.x 一档：这条验收项要证的是**打包 → 全局装 → PATH 上跑得起来**，
  # 那是 npm 与平台的事，不是 Node 版本的事；而下限档自带的 npm 最老，兼容性风险
  # 也压在这一档上。
  global-install:
    name: npm i -g · ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: node scripts/check-global-install.mjs

  # 版本守卫的**正面**验证：在一个真正低于下限的 Node 上跑 bin/difftab.js。
  #
  # 为什么另起一档：matrix 与 build 都跑在 ≥22 上，而守卫要防的是**解析期**失败——
  # 在 22+ 上文件早已解析成功，守卫必然执行，那条路径永远测不到。冒烟里那条
  # 「不含 ?. / ?? / 顶层 await / #私有字段 / ||=」的正则清单是它的替身：替身按
  # 5 个具体语法逐条列举，而 catch {}、对象展开、class 静态块、** 等一律漏网，
  # 后果正是禁止的「用户看到 SyntaxError 而不是友好提示」。这一档直接断言那句话。
  #
  # 三个平台各跑一次(S5)：守卫里那句提示要经 `writeSync(2, …)` 出来，而那条
  # 红线说的正是"`process.stderr.write` + `process.exit` 在 Windows 上写管道时是异步的、
  # 整条消息会被丢掉"——那种失效只在 Windows 上看得见。**写法本身另有一条静态断言
  # 罩着**(冒烟里的「退出前的报错一律 writeSync(2, …)」，连动态 import 失败那个出口
  # 一起罩)，这一档是它的行为侧背书：静态扫描证明源码没写错，这里证明真跑起来那句话
  # 确实到得了管道对面。
  #
  # 本档不需要 dist/：守卫在 import 主模块**之前**就退出了(冒烟里另有一条断言
  # stdout 为空，证的就是这个顺序)。
  old-node-guard:
    name: 版本守卫 · Node 20 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 低于下限时给友好提示，而不是 SyntaxError
        shell: bash
        run: |
          set +e
          # **stderr 必须经管道取回，不能重定向到文件**：这条断言同时守着那条
          # 「退出前一律 writeSync(2, …)」——`process.stderr.write` + `process.exit()`
          # 只在写**管道**时才会在 Windows 上丢消息，写文件是同步的、照样能收到。
          # 用文件的话这一档在 Windows 上恒绿，而真实用户(任何以 stdio: 'pipe' 起它的
          # 父进程)看到的是空 stderr 加一个光秃秃的 1。
          #
          # **只跑一次**：重定向从左往右生效，`2>&1` 先把 fd2 指到命令替换的那根管道，
          # 随后 `>out.txt` 才把 fd1 挪去文件——于是 stderr 走管道、stdout 落文件，
          # 退出码、空 stdout、stderr 三条断言描述的是**同一个进程**。跑两遍的话它们
          # 分属两个进程，永远矛盾不起来，也就永远红不了。
          err=$(node bin/difftab.js --version 2>&1 >out.txt)
          status=$?
          out=$(cat out.txt)
          echo "exit=$status"; echo "stdout=[$out]"; echo "stderr=$err"
          [ "$status" -eq 1 ]                        || { echo 'FAIL 期望以 1 退出'; exit 1; }
          [ -z "$out" ]                              || { echo 'FAIL 主模块被加载了——守卫没有先于 import 执行'; exit 1; }
          case "$err" in *SyntaxError*) echo 'FAIL 解析期就炸了，守卫根本没来得及跑'; exit 1;; esac
          case "$err" in *'requires Node.js'*) ;; *) echo 'FAIL 没有打印友好提示'; exit 1;; esac
          echo 'PASS 版本守卫在真实的低版本 Node 上按预期工作'
