# pnpm 设置的唯一位置。
# pnpm 11 起不再读 package.json 的 `pnpm` 字段，.npmrc 只保留 registry / 鉴权；
# 写错位置不报错、无 deprecation 警告，只是静默不生效。

# 依赖的生命周期脚本默认不执行，需要执行的必须显式列入白名单。
# lefthook 靠安装后脚本把 git hooks 写进 .git/hooks，漏列则 hooks 不装。
allowBuilds:
  lefthook: true
# 有依赖的构建脚本不在 allowBuilds 里时让 install 以非零退出。默认就是 true，
# 显式写出是为钉住它（CI 查这一行）：漏列的若不是 lefthook（没有钩子文件可查），
# 会响的只有这一条。
strictDepBuilds: true
# pnpm 11 起默认对刚发布不久的版本设了最短发布年龄门槛。下面这条是 `pnpm install`
# 自己写进来的豁免，入库是为了让 CI 与他人机器上的 --frozen-lockfile 结果一致。
minimumReleaseAgeExclude:
  - vite@8.2.1
